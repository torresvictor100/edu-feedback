spring.application.name=edufeedback-backend

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:edufeedback}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET:changeit-local-dev-secret-changeit-local-dev-secret}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

app.nota-critica-limite=${NOTA_CRITICA_LIMITE:3}

azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
azure.storage.queue.notificacoes-criticas=notificacoes-criticas

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
