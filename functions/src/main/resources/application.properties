quarkus.application.name=edufeedback-functions

quarkus.datasource.db-kind=postgresql

# Schema já existe (criado via Flyway pelo Servico A) — Quarkus nunca cria/altera tabelas em dev/prod.
%dev.quarkus.hibernate-orm.database.generation=none
%prod.quarkus.hibernate-orm.database.generation=none

%dev.quarkus.datasource.username=${POSTGRES_USER:postgres}
%dev.quarkus.datasource.password=${POSTGRES_PASSWORD:postgres}
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:edufeedback}

%prod.quarkus.datasource.username=${POSTGRES_USER}
%prod.quarkus.datasource.password=${POSTGRES_PASSWORD}
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DB}

# Testes: sem URL configurada de propósito — Quarkus Dev Services sobe um Postgres
# efêmero via Testcontainers.
%test.quarkus.hibernate-orm.database.generation=drop-and-create

quarkus.smallrye-health.root-path=/health

# Segredo compartilhado só entre os gatilhos nativos (Timer/Queue) e os endpoints
# internos — nunca exposto fora do próprio Function App.
internal.trigger-secret=${INTERNAL_TRIGGER_SECRET:changeit-local-dev-internal-secret}

# Sem expressão ${VAR:} de propósito — Quarkus já mapeia as variáveis de ambiente
# AZURE_COMMUNICATION_SERVICES_* para estas chaves automaticamente. O valor vazio
# abaixo é só o default local (EmailService cai no modo "log apenas", sem Azure).
azure.communication-services.connection-string=
azure.communication-services.sender-address=
